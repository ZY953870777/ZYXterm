name: Release Windows + Linux x64

# 让 GitHub 自行完成：编译 FreeRDP + addon → 打包安装包 → 创建/更新 GitHub
# Release 并上传 latest*.yml + 安装包（electron-updater 自动更新用）。
#
# 触发方式（二选一）：
#   1. 推送版本标签：  git tag v0.1.0 && git push origin v0.1.0
#   2. 网页手动触发：  Actions → Release Windows + Linux x64 → Run workflow
#
# 产物：Windows（nsis 安装包）、Linux（AppImage + deb），上传到同一 Release。
# 要求：仓库需可写（GITHUB_TOKEN + contents:write 即可，公开/私有均可用）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # Windows x64：MSVC + vcpkg 源码编译 FreeRDP 3，node-gyp 编 addon
  # ============================================================
  release-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    env:
      FREERDP_VERSION: "3.30.0"
      VCPKG_DEFAULT_TRIPLET: "x64-windows"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # ---------- 编译 FreeRDP 3 ----------
      - name: Install deps (vcpkg)
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows openssl:x64-windows libusb:x64-windows

      - name: Clone FreeRDP
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FREERDP_VERSION `
            https://github.com/FreeRDP/FreeRDP.git freerdp-src

      - name: Configure FreeRDP
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", "freerdp-src", "-B", "build", "-G", "Visual Studio 17 2022", "-A", "x64",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DWITH_FFMPEG=OFF", "-DWITH_DSP_FFMPEG=OFF", "-DWITH_VIDEO_FFMPEG=OFF",
            "-DWITH_SWSCALE=OFF", "-DWITH_CAIRO=OFF", "-DWITH_OPUS=OFF", "-DWITH_OPENH264=OFF",
            "-DWITH_GSM=OFF", "-DWITH_LAME=OFF", "-DWITH_FAAD2=OFF", "-DWITH_FAAC=OFF",
            "-DWITH_FDK_AAC=OFF", "-DWITH_SOXR=OFF",
            "-DWITH_WAYLAND=OFF", "-DWITH_X11=OFF", "-DWITH_PULSE=OFF", "-DWITH_ALSA=OFF", "-DWITH_PCSC=OFF",
            "-DWITH_SERVER=OFF", "-DWITH_SHADOW=OFF", "-DWITH_PROXY=OFF",
            "-DWITH_CLIENT=ON", "-DWITH_OPENSSL=ON", "-DWITH_ZLIB=ON",
            "-DCMAKE_BUILD_TYPE=Release"
          )
          cmake @cmakeArgs

      - name: Build FreeRDP
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ---------- 打包运行库到 resources/freerdp ----------
      - name: Package FreeRDP runtime
        shell: pwsh
        run: |
          $pkg = "resources/freerdp"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          if (Test-Path "build/client/Windows/cli/Release/wfreerdp.exe") {
            Copy-Item "build/client/Windows/cli/Release/wfreerdp.exe" $pkg -Force
          }
          Get-ChildItem build -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName $pkg -Force
          }
          $bin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
          if (Test-Path $bin) {
            Get-ChildItem $bin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName $pkg -Force
            }
          }

      # ---------- 打包开发头文件 + import lib（供 addon 编译）----------
      - name: Package dev headers + libs
        shell: pwsh
        run: |
          $tp = "native/freerdp/third_party/freerdp"
          New-Item -ItemType Directory -Force -Path "$tp/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tp/lib" | Out-Null
          $devInclude = "package/freerdp/include"
          New-Item -ItemType Directory -Force -Path $devInclude | Out-Null
          if (Test-Path "freerdp-src/include") { Copy-Item "freerdp-src/include/*" $devInclude -Recurse -Force }
          if (Test-Path "build/include") { Copy-Item "build/include/*" $devInclude -Recurse -Force }
          if (Test-Path "freerdp-src/winpr/include") { Copy-Item "freerdp-src/winpr/include/*" $devInclude -Recurse -Force }
          Get-ChildItem build -Recurse -Directory -Filter include | ForEach-Object {
            Copy-Item "$($_.FullName)/*" $devInclude -Recurse -Force
          }
          $devLib = "package/freerdp/lib"
          New-Item -ItemType Directory -Force -Path $devLib | Out-Null
          Get-ChildItem build -Recurse -Filter *.lib | Copy-Item -Destination $devLib -Force
          Copy-Item "$devInclude/*" "$tp/include" -Recurse -Force
          Copy-Item "$devLib/*.lib" "$tp/lib" -Force

      # ---------- 编译 addon（Electron ABI, win32-x64）----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compile freerdp addon
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts node-addon-api node-gyp
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ev = ($pkg.devDependencies.electron -replace '[\^~]', '')
          npx node-gyp rebuild --directory=native/freerdp --target=$ev --arch=x64 --dist-url=https://electronjs.org/headers
          Copy-Item "native/freerdp/build/Release/freerdp.node" "resources/freerdp/freerdp.node" -Force

      # ---------- 安装依赖 + 构建 + 打包发布 ----------
      - name: Install project deps
        # serialport 用 N-API 预编译（跨 ABI），无需 node-gyp 重编译
        run: npm ci --ignore-scripts

      - name: Build app
        run: npm run build

      - name: Package & Publish Windows Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyxterm-windows-setup
          path: dist/*.exe

  # ============================================================
  # Linux x64：apt 装系统 freerdp3 开发库，node-gyp 编 addon，
  # 随包分发 libfreerdp3/libwinpr3 .so（rpath=$ORIGIN 加载）
  # ============================================================
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FreeRDP3 dev + build tools
        run: |
          sudo apt-get update
          # Ubuntu 24.04+ 的 FreeRDP3 开发包名为 freerdp3-dev（fallback 兼容）；
          # patchelf 用于给 freerdp 运行库设置 rpath（随包加载依赖）
          sudo apt-get install -y freerdp3-dev patchelf \
            || sudo apt-get install -y libfreerdp3-dev patchelf \
            || sudo apt-get install -y libfreerdp-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compile freerdp addon (Linux)
        shell: bash
        run: |
          npm install --no-save --ignore-scripts node-addon-api node-gyp
          # npm ci 在后续步骤才执行，此处 node_modules/electron 尚不存在，从 package.json 读版本。
          # 注意：bash 赋值不能带 $ 前缀（$ev= 会把 =... 当命令执行）
          ev=$(node -e "console.log(require('./package.json').devDependencies.electron.replace(/[\^~]/,''))")
          npx node-gyp rebuild --directory=native/freerdp --target=$ev --arch=x64 --dist-url=https://electronjs.org/headers
          mkdir -p resources/freerdp/build/Release
          cp -f native/freerdp/build/Release/freerdp.node resources/freerdp/build/Release/
          # 复制 FreeRDP 运行库到 addon 同目录（rpath=$ORIGIN 加载）
          for lib in libfreerdp3.so.3 libwinpr3.so.3; do
            src=$(find /usr/lib -name "$lib*" -type f 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp -f "$src" "resources/freerdp/build/Release/$lib"
              echo "  ✓ 已准备 $lib"
            fi
          done
          # 用 ldd 收集 addon 与 freerdp 运行库的全部动态依赖（如 ICU 等）随包分发，
          # 避免目标机因版本不同报 "libicuuc.so.74: cannot open shared object file"
          collect_deps() {
            ldd "$1" 2>/dev/null | grep '=>' | awk '{print $3}' | while read -r so; do
              case "$so" in /*) ;; *) continue ;; esac
              base=$(basename "$so")
              # 跳过目标系统必有的 glibc 基础库
              case "$base" in
                libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libgcc_s.so*|libstdc++.so*|ld-linux*) continue ;;
              esac
              if [ ! -f "resources/freerdp/build/Release/$base" ]; then
                cp -f "$so" "resources/freerdp/build/Release/$base" 2>/dev/null || true
                echo "  ✓ 随包依赖: $base"
              fi
            done
          }
          collect_deps "resources/freerdp/build/Release/freerdp.node"
          collect_deps "resources/freerdp/build/Release/libfreerdp3.so.3"
          collect_deps "resources/freerdp/build/Release/libwinpr3.so.3"
          # 给 freerdp 运行库设 rpath=$ORIGIN（--force-rpath=DT_RPATH，找不到再回退系统路径），
          # 使其依赖（ICU 等）从自身目录加载；不设全局 LD_LIBRARY_PATH，避免影响 Electron utility 进程
          patchelf --set-rpath '$ORIGIN' --force-rpath resources/freerdp/build/Release/libfreerdp3.so.3
          patchelf --set-rpath '$ORIGIN' --force-rpath resources/freerdp/build/Release/libwinpr3.so.3
          echo "  ✓ 已为 freerdp 运行库设置 rpath=\$ORIGIN"

      - name: Install project deps
        run: npm ci --ignore-scripts

      - name: Build app
        run: npm run build

      - name: Package & Publish Linux Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish always

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyxterm-linux
          path: dist/*.AppImage
